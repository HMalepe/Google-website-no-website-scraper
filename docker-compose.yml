services:
  webscrape:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3847
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - webscrape_data:/app/data
    expose:
      - "3847"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webscrape

volumes:
  webscrape_data:
  caddy_data:
  caddy_config:
